version: '3.8'

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      # Add database connection details if needed
      # - DB_HOST=your-database-host
      # - DB_PORT=5432
      # - DB_NAME=modresorts
      # - DB_USER=dbuser
      # - DB_PASSWORD=dbpassword
    networks:
      - modresorts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  modresorts-network:
    driver: bridge
