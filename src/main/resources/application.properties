# ModResorts Cloud-Ready Configuration
# All sensitive values are externalized to environment variables

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Info
spring.application.name=modresorts
management.endpoints.web.exposure.include=health,info,metrics

# Database Configuration (AWS RDS)
# These are read from environment variables in ModResortsApplication.java
# DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER

# HikariCP Connection Pool Settings
# DB_POOL_SIZE, DB_MIN_IDLE, DB_CONN_TIMEOUT, DB_IDLE_TIMEOUT, DB_MAX_LIFETIME

# Redis Session Configuration (Amazon ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.session.store-type=redis
spring.session.redis.namespace=modresorts:session

# AWS Configuration
# AWS SDK will use default credential chain (IAM roles, environment variables, etc.)
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET_NAME:modresorts-data}

# Logging Configuration (Cloud-friendly structured logging)
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Health Check
management.health.redis.enabled=true
management.health.db.enabled=true

# Servlet Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
