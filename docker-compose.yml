version: "3.8"

services:
  modresorts:
    image: modresorts:latest
    container_name: modresorts-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # JVM settings
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      # Application configuration
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - JNDI_PROVIDER_URL=${JNDI_PROVIDER_URL:-}
      - SERVER_DISPLAY_NAME=${SERVER_DISPLAY_NAME:-modresorts}
      - SERVER_FULL_NAME=${SERVER_FULL_NAME:-modresorts-container}
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  app-network:
    driver: bridge
