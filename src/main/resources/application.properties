# Spring Boot Application Configuration for ModResorts
# Cloud-ready configuration with externalized settings

# Application name
spring.application.name=modresorts

# Server configuration (port from environment variable)
server.port=${PORT:8080}

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET_NAME:modresorts-data}
aws.secrets.weather-api=${WEATHER_API_SECRET_NAME:modresorts/weather-api}

# S3 Storage Configuration
storage.use-s3=${USE_S3_STORAGE:false}

# Database Configuration (HikariCP connection pooling)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# HikariCP Configuration
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Logging Configuration (JSON format for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
